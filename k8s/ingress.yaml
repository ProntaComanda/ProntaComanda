
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pronta-comanda
  namespace: pronta-comanda
  labels:
    app.kubernetes.io/part-of: pronta-comanda
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 6m
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  rules:
    - host: pronta-comanda.localtest.me
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
