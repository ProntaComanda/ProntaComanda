
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: pronta-comanda

resources:
  - namespace.yaml
  - mongo.yaml
  - backend.yaml
  - frontend.yaml

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: pronta-comanda-config
    literals:
      - NODE_ENV=development
      - PORT=3333
      - MONGO_URI=mongodb://mongo:27017/pronta-comanda
      - JWT_EXPIRES_IN=8h
      - TZ_ESTABELECIMENTO=America/Sao_Paulo
      - FRONTEND_URL=http://localhost:8080
      - TRUST_PROXY=1
  - name: nginx-conf
    files:
      - default.conf=nginx-k8s.conf

secretGenerator:
  - name: pronta-comanda-secret
    envs:
      - secret.env

images:
  - name: pronta-comanda-backend
    newTag: local
  - name: pronta-comanda-frontend
    newTag: local
