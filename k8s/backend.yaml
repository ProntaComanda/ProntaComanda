
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: uploads
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: pronta-comanda
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: pronta-comanda
spec:
  selector:
    app.kubernetes.io/name: backend
  ports:
    - name: http
      port: 3333
      targetPort: 3333
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: pronta-comanda
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend
        app.kubernetes.io/part-of: pronta-comanda
    spec:
      initContainers:
        - name: espera-mongo
          image: pronta-comanda-backend
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - >-
              until node -e "require('net').connect(27017,'mongo').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))";
              do echo 'aguardando o mongo...'; sleep 2; done
        - name: permissao-uploads
          image: pronta-comanda-backend
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "chown -R 1000:1000 /app/uploads"]
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: uploads
              mountPath: /app/uploads
      containers:
        - name: backend
          image: pronta-comanda-backend
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3333
          envFrom:
            - configMapRef:
                name: pronta-comanda-config
          env:
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: pronta-comanda-secret
                  key: JWT_SECRET
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: uploads
              mountPath: /app/uploads
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: uploads
