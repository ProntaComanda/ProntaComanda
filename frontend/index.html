<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pronta Comanda</title>

    <!-- Fontes do design: Archivo Black (títulos) e Rubik (texto) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Rubik:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Aplica o tema salvo antes do primeiro render (evita piscar claro -> escuro).
         Mesma regra de src/store/themeStore.js. -->
    <script>
      (function () {
        try {
          var salvo = localStorage.getItem('pc-tema');
          var escuro =
            salvo === 'dark' ||
            (salvo !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', escuro);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
